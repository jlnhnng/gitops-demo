apiVersion: helm.toolkit.fluxcd.io/v2 
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 10m
  timeout: 15m 
  chart:
    spec:
      chart: nextcloud
      version: "9.4.1" 
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1

    livenessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    # ---------- Nextcloud ----------
    nextcloud:
      host: nextcloud.ntnxlab.local 
      trustedDomains:
        - nextcloud.ntnxlab.local
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password

    ingress:
      enabled: true
      className: kommander-traefik

    cronjob:
      enabled: true

    persistence:
      enabled: true
      storageClass: nutanix-files 
      accessMode: ReadWriteMany
      size: 10Gi
      nextcloudData:
        enabled: true
        storageClass: nutanix-files 
        accessMode: ReadWriteMany
        size: 50Gi

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-secrets
        usernameKey: db-username
        passwordKey: db-password

    postgresql:
      enabled: true
      global:
        postgresql:
          auth:
            database: nextcloud
            username: nextcloud
            existingSecret: nextcloud-secrets
            secretKeys:
              adminPasswordKey: db-admin-password
              userPasswordKey: db-password
      primary:
        persistence:
          enabled: true
          storageClass: nutanix-volume
          size: 10Gi

    redis:
      enabled: true
      auth:
        enabled: true
        existingSecret: nextcloud-secrets
        existingSecretPasswordKey: redis-password
      master:
        persistence:
          enabled: false
      replica:
        replicaCount: 0
        persistence:
          enabled: false
