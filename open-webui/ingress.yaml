apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  annotations:
    cert-manager.io/cluster-issuer: kommander-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: kommander-traefik
  tls:
    - hosts:
        - open-webui.10.38.207.171.sslip.io
      secretName: open-webui-tls
  rules:
    # Open WebUI does not support sub-path hosting, so it needs its own hostname.
    - host: open-webui.10.38.207.171.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  name: http
